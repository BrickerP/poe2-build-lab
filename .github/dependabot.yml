version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      official-actions:
        patterns:
          - "actions/*"
    commit-message:
      prefix: "chore(actions)"
